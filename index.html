<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Společný statek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>window.mqtt || document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"><\/script>');</script>
<style>
:root{
  --bg:#f8f6ee; --card:#ffffff; --ink:#2a2a1f; --muted:#6b6a55; --line:#e6e1cc;
  --accent:#3f8a2e; --good:#1f9d55; --warm:#ef7312; --bad:#c8371d; --sun:#fff6db; --sunline:#ffe08a;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --rainbow:linear-gradient(90deg,#ef321f,#ef7312,#fabd0b,#73c82c,#2d72c0,#8b369e);
  --earth:linear-gradient(90deg,#8a5a2b,#c99a45,#fabd0b,#73c82c,#3f8a2e);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:6px;background:var(--earth);z-index:5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
header{max-width:1100px;margin:0 auto;padding:28px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-width:0}
.school{height:clamp(44px,8vw,64px);width:auto;display:block}
.divider{width:3px;align-self:stretch;min-height:40px;border-radius:3px;background:var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1;margin:0}
.logo span{background:var(--earth);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:520px){.divider{display:none}.brand{gap:8px}}
.home-btn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700;color:var(--muted)}
.home-btn:hover{border-color:var(--accent);color:var(--accent)}

main{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.lead{font-size:18px;color:var(--muted);margin:0;text-wrap:balance}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;display:grid;gap:12px;min-width:0;position:relative;overflow:hidden;align-content:start}
.card h2{font-family:var(--display);font-size:24px;margin:0;font-weight:600}
.card h3{font-family:var(--display);font-size:19px;margin:0;font-weight:600}
.card p{margin:0}
.stripe{position:absolute;inset:0 0 auto;height:8px}
.label{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
.field input,.join-row input,textarea{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);font-size:18px;width:100%;min-width:0}
textarea{font-size:16px;resize:vertical;min-height:70px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{font-size:30px;line-height:1;padding:8px;border-radius:16px;border:3px solid var(--line);background:var(--bg)}
.avatars button.sel{border-color:var(--accent);background:#eaf5e4}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice p{color:var(--muted)}
.big-btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:17px;color:#fff;background:var(--accent);box-shadow:0 4px 0 rgba(42,35,20,.25);transition:transform .08s}
.big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(42,35,20,.25)}
.big-btn:disabled{opacity:.5;cursor:not-allowed}
.small-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:800;font-size:15px;line-height:1.25}
.small-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.small-btn:disabled{opacity:.45;cursor:not-allowed}
.small-btn.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.join-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.join-row input{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:20px}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--sun);border:2px solid var(--sunline);font-size:15px}
.code{font-family:var(--display);font-weight:700;letter-spacing:.18em;background:var(--earth);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}

/* horní lišta */
.topbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:8px 12px;display:grid;gap:0;min-width:0}
.stat b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat.neg b{color:var(--bad)}
.season-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.season{font-family:var(--display);font-size:clamp(24px,4vw,32px);font-weight:600;margin:0;line-height:1.1}
.weather{display:flex;gap:10px;align-items:center;background:var(--sun);border:2px solid var(--sunline);border-radius:16px;padding:8px 12px}
.weather .wi{font-size:30px;line-height:1}
.players{display:flex;flex-wrap:wrap;gap:6px}
.player{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:15px}
.player.ready{border-color:var(--good);background:#e8f6ec}
.player .you{font-size:11px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.conn{margin:0;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#bbb}
.dot.on{background:var(--good)}.dot.off{background:var(--bad)}

/* mapa */
.play{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.play{grid-template-columns:minmax(0,1fr)}}
.map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;background:#d9cfa8;padding:6px;border-radius:18px}
.tile{aspect-ratio:1;border:0;border-radius:12px;position:relative;display:grid;place-items:center;padding:2px;min-width:0;overflow:hidden;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:transform .08s}
.tile:hover{transform:scale(1.04);z-index:1}
.tile.sel{outline:4px solid var(--ink);outline-offset:-2px;z-index:2}
.tile .ti{font-size:clamp(20px,4.6vw,36px);line-height:1}
.tile .tn{position:absolute;left:3px;right:3px;bottom:2px;font-size:10px;font-weight:800;line-height:1.1;color:rgba(0,0,0,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tile .badge{position:absolute;top:3px;right:4px;font-size:12px;line-height:1}
.tile.ripe .ti{animation:bob 1.4s ease-in-out infinite}
.tile.t-P{background:repeating-linear-gradient(0deg,var(--soil) 0 7px,var(--soil2) 7px 9px)}
.tile.t-P.grown{background:repeating-linear-gradient(0deg,#9ccc65 0 7px,#86b84f 7px 9px)}
.tile.t-P.ripe{background:repeating-linear-gradient(0deg,#f1d36b 0 7px,#e3c159 7px 9px)}
.tile.t-L{background:#a9d97a}
.tile.t-F{background:#4f9a43}.tile.t-F .tn{color:rgba(255,255,255,.85)}
.tile.t-F.cut{background:#b9a27a}
.tile.t-W{background:#6cbbe8}
.tile.t-D{background:#f3d9a4}
.tile.t-U{background:repeating-linear-gradient(45deg,#cfc29a 0 6px,#c3b58b 6px 12px)}
@media (max-width:600px){.tile .tn{font-size:8px}.map{gap:3px;padding:4px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* detail */
.bar{height:12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.meter{display:grid;gap:3px}
.meter .mh{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.crops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.crop-btn{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;display:grid;gap:2px;box-shadow:0 3px 0 var(--line)}
.crop-btn:hover:not(:disabled){border-color:var(--accent)}
.crop-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.crop-btn b{font-size:16px}
.crop-btn small{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.3}
.crop-btn .hint{color:var(--accent)}.crop-btn .warn{color:var(--bad)}
.status{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.tip{font-size:14px;color:var(--muted);border-left:4px solid var(--sunline);padding-left:10px}

/* záložky */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:800}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.log{display:grid;gap:6px;max-height:420px;overflow:auto;padding-right:4px}
.log div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:15px;padding:6px 8px;border-radius:10px;background:var(--bg)}
.log div.sys{background:var(--sun)}
.log .when{font-size:12px;color:var(--muted);font-weight:700}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tips .card{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.market{border-collapse:collapse}
@media (max-width:640px){.market thead{display:none}.market tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .market td{border:0;padding:0}.market td:nth-child(3){grid-column:1/-1;text-align:left;color:var(--muted);font-size:14px}.market td:last-child{grid-column:1/-1}}
.chart{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- nový statek ---------- */
function rollWeather(season, rnd=Math.random){
  const tbl = season===3 ? [['snih',3],['mraz',1.5],['norm',1]] : [['ok',3],['norm',4],['sucho',2],['dest',1.5]];
  let x = rnd() * tbl.reduce((s,a)=>s+a[1],0);
  for(const [k,w] of tbl){ if((x-=w) < 0) return k; } return 'norm';
}
function rollPrices(season, rnd=Math.random){
  const p = {};
  for(const [k,it] of Object.entries(ITEMS)){
    if(!it.p) continue;
    let m = 0.88 + rnd()*0.24;
    if(it.grain || k==='repka') m *= (season===1||season===2) ? 0.92 : 1.07;   // po žních je obilí levné
    if(k==='seno') m *= (season===3||season===0) ? 1.2 : 0.9;                // v zimě je seno drahé
    p[k] = Math.round(it.p*m/10)*10;
  }
  return p;
}
function newState(c, rndSeed){
  const rnd = seeded(rndSeed || c || rand(6));
  const tiles = []; let fi = 0, li = 0, wi = 0, ui = 0, foi = 0;
  LAYOUT.join('').split('').forEach(t => {
    const x = {t};
    if(t==='P'){
      x.name = FIELD_NAMES[fi++] || 'Pole '+fi;
      x.N = Math.round(35 + rnd()*35); x.H = Math.round(32 + rnd()*33);
      x.hist = [pickR(rnd, ['psenice','jecmen','kukurice','repka','psenice','jecmen'])];
      x.crop = null;
    }
    if(t==='L') x.name = 'Louka ' + (++li);
    if(t==='F'){ x.name = ['Bučina','Smrčiny','Doubrava','Háj','Remíz','Olšina','Borek'][foi++] || 'Les'; x.age = Math.round(6 + rnd()*26); }
    if(t==='W'){ x.name = ++wi===1 ? 'Návesní rybník' : 'Malý rybník'; x.stocked = false; x.fhp = 1; }
    if(t==='D') x.name = 'Statek';
    if(t==='U') x.name = 'Pustina ' + (++ui);
    tiles.push(x);
  });
  // část polí je oseta už z loňského podzimu
  const fields = tiles.map((t,i)=>t.t==='P'?i:-1).filter(i=>i>=0);
  [[fields[0],'psenice'],[fields[3],'psenice'],[fields[6],'psenice'],[fields[8],'repka'],[fields[11],'repka']].forEach(([i,k]) => {
    if(i==null) return; tiles[i].crop = {k, age:2, ripe:false, late:0, hp:1};
  });
  return {
    v:1, code:c, name:'Náš statek', rev:1, by:'', ts:Date.now(),
    year:1, season:0, weather:rollWeather(0, rnd), prices:rollPrices(0, rnd),
    money:START_MONEY, store:{psenice:2, seno:10, hnuj:30}, animals:{kravy:4, slepice:1, ula:0},
    tiles, log:[{ts:Date.now(), by:'', txt:'🏡 Statek byl založen. Hodně štěstí, hospodáři!'}],
    hist:[], ready:{}, applied:[], players:{}
  };
}
function pickR(rnd, a){ return a[Math.floor(rnd()*a.length)]; }

/* ---------- výpočty ---------- */
const sk = st => st.year*4 + st.season;
const seasonName = (y,s) => `Rok ${y} · ${SEAS[s].n}`;
function neighbors(i){ const r=Math.floor(i/COLS), c=i%COLS, out=[];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const rr=r+dr, cc=c+dc;
    if(rr>=0&&cc>=0&&rr<LAYOUT.length&&cc<COLS) out.push(rr*COLS+cc); } return out; }
const nearWater = (st,i) => neighbors(i).some(j => st.tiles[j].t==='W');
function rotationFactor(t, k){
  const prev = t.hist[t.hist.length-1]; if(!prev) return 1;
  if(prev===k) return 0.75;
  if(prev==='jetel') return 1.15;
  if(CROPS[prev] && CROPS[prev].fam===CROPS[k].fam && CROPS[k].fam==='obili') return 0.9;
  return 1;
}
function rotationNote(t, k){
  const f = rotationFactor(t,k), prev = t.hist[t.hist.length-1];
  if(f===0.75) return ['warn','Stejná plodina jako minule −25 %'];
  if(f===0.9) return ['warn',`Obilí po obilí (${CROPS[prev].n.split(' ')[0].toLowerCase()}) −10 %`];
  if(f===1.15) return ['hint','Po jeteli +15 %'];
  return ['hint','Dobré střídání plodin'];
}
function nFactor(N, need){ if(need<=0) return 1; return N>=need ? 1 + Math.min(0.1,(N-need)/200) : 0.4 + 0.6*N/need; }
const hFactor = H => 0.75 + H/200;
function yieldOf(st, t){
  const c = t.crop, C = CROPS[c.k];
  let y = C.y * nFactor(t.N, C.need) * hFactor(t.H) * rotationFactor(t, c.k) * c.hp;
  if((c.k==='repka'||c.k==='jetel') && st.animals.ula>0) y *= 1.1;
  return y;
}
const fields = st => st.tiles.filter(t=>t.t==='P');
const soilScore = st => { const f=fields(st); return f.length ? Math.round(f.reduce((s,t)=>s+t.H,0)/f.length) : 0; };
function natureScore(st){
  let s = 0; const kinds = new Set();
  for(const t of st.tiles){
    if(t.t==='F') s += t.age>=0 ? (t.age>=12 ? 4 : 2) : 0;
    if(t.t==='L') s += 3;
    if(t.t==='W') s += 3;
    if(t.t==='U') s += 3;
    if(t.t==='P'){
      if(!t.crop) s += 1;
      else { kinds.add(t.crop.k); if(t.crop.k==='jetel'||t.crop.k==='repka') s += 2; if(t.crop.k==='kukurice') s -= 2; }
    }
  }
  s += kinds.size*3 + Math.min(3, st.animals.ula)*4;
  if(soilScore(st) < 40) s -= 10;
  return clamp(Math.round(s), 0, 100);
}
function feedPlan(st, season=st.season){
  const k = st.animals.kravy, louky = st.tiles.filter(t=>t.t==='L').length;
  const cap = season<=1 ? louky*2 : 0;
  const hay = Math.max(0, k-cap)*1.5;
  const grain = st.animals.slepice*0.4;
  const grainHave = Object.keys(ITEMS).filter(x=>ITEMS[x].grain).reduce((s,x)=>s+(st.store[x]||0),0);
  return {hay, grain, cap, hayHave: st.store.seno||0, grainHave};
}
const provoz = st => PROVOZ + PROVOZ_KRAVA*st.animals.kravy;
const dotace = st => 3000*st.tiles.filter(t=>t.t==='P'||t.t==='L').length;

/* ---------- akce (stejné u všech hráčů) ---------- */
class Nope extends Error {}
const need = (cond, msg) => { if(!cond) throw new Nope(msg); };
function addLog(st, by, txt){ st.log.push({ts:Date.now(), by, txt}); if(st.log.length>150) st.log.splice(0, st.log.length-150); }
function pay(st, amt, what){ need(st.money >= amt, `Na ${what} nemáte v kase dost peněz (${kc(amt)}).`); st.money -= amt; }
function tileAt(st, i){ const t = st.tiles[i]; need(t, 'Takové místo na statku není.'); return t; }

function applyOp(st, op){
  const by = op.by, s = st.season;
  switch(op.type){
  case 'hello': {
    const known = st.players[by];
    st.players[by] = {name:String(op.name||'Hospodář').slice(0,16), avatar:String(op.avatar||'🧑‍🌾').slice(0,8)};
    if(!known) addLog(st, by, 'přišel/přišla na statek 👋');
    return; }
  case 'sow': {
    const t = tileAt(st, op.i), C = CROPS[op.k];
    need(t.t==='P', 'Sít se dá jen na pole.'); need(C, 'Neznámá plodina.'); need(!t.crop, 'Pole už je oseté.');
    need(C.sow===s, `${C.n} se seje ${['na jaře','v létě','na podzim','v zimě'][C.sow]}.`);
    pay(st, C.seed, 'osivo');
    t.crop = {k:op.k, age:0, ripe:false, late:0, hp:1};
    addLog(st, by, `zasel/a ${C.ico} ${C.n.toLowerCase()} na poli ${t.name} (osivo ${kc(C.seed)})`); return; }
  case 'harvest': {
    const t = tileAt(st, op.i); need(t.crop && t.crop.ripe, 'Tady zatím není co sklízet.');
    const C = CROPS[t.crop.k], amt = r1(yieldOf(st, t) * clamp(+op.r||1, 0.9, 1.1));
    st.store[C.item] = r1((st.store[C.item]||0) + amt);
    t.N = clamp(Math.round(t.N - C.need), 0, 100); t.H = clamp(t.H + C.hum, 0, 100);
    t.hist.push(t.crop.k); if(t.hist.length>4) t.hist.shift();
    t.crop = null;
    addLog(st, by, `sklidil/a ${C.ico} ${t1(amt)} t z pole ${t.name}`); return; }
  case 'plow': {
    const t = tileAt(st, op.i); need(t.crop && !t.crop.ripe, 'Zaorat se dá jen rostoucí porost.');
    const k = t.crop.k; t.crop = null;
    if(k==='jetel'){ t.N = clamp(t.N+12,0,100); t.H = clamp(t.H+3,0,100); addLog(st, by, `zaoral/a jetel na poli ${t.name} jako zelené hnojení ☘️`); }
    else addLog(st, by, `zaoral/a ${CROPS[k].n.toLowerCase()} na poli ${t.name}`);
    return; }
  case 'fert': {
    const t = tileAt(st, op.i); need(t.t==='P', 'Hnojí se jen pole.');
    need(s!==3, 'V zimě se hnojit nesmí – zmrzlá půda živiny nepojme a voda by je odnesla do potoka.');
    need(t.fs !== sk(st), 'Toto pole už jste v tomto období hnojili.');
    if(op.kind==='hnuj'){ need((st.store.hnuj||0) >= 10, 'Ve skladu není 10 t hnoje.'); st.store.hnuj = r1(st.store.hnuj-10);
      t.N = clamp(t.N+15,0,100); t.H = clamp(t.H+4,0,100); addLog(st, by, `pohnojil/a pole ${t.name} hnojem 💩 (10 t)`); }
    else { pay(st, 7000, 'průmyslové hnojivo'); t.N = clamp(t.N+30,0,100); t.H = clamp(t.H-1,0,100);
      addLog(st, by, `pohnojil/a pole ${t.name} průmyslovým hnojivem 🧪 (${kc(7000)})`); }
    t.fs = sk(st); return; }
  case 'mow': {
    const t = tileAt(st, op.i); need(t.t==='L', 'Kosit se dá louka.'); need(s===1||s===2, 'Louky se kosí v létě (seno) a na podzim (otava).');
    need(t.mown !== sk(st), 'Tuto louku jste už v tomto období posekali.');
    const w = st.weather==='sucho' ? 0.7 : st.weather==='ok' ? 1.1 : 1;
    const amt = r1(3*w); st.store.seno = r1((st.store.seno||0)+amt); t.mown = sk(st);
    addLog(st, by, `posekal/a louku ${t.name}: +${t1(amt)} t sena 🌿`); return; }
  case 'cut': {
    const t = tileAt(st, op.i); need(t.t==='F' && t.age>=12, 'Les je na těžbu ještě mladý (potřebuje aspoň 3 roky).');
    st.store.drevo = r1((st.store.drevo||0)+25); t.age = -1;
    addLog(st, by, `vytěžil/a les ${t.name}: +25 m³ dřeva 🪓. Zbyla paseka – je potřeba ji zalesnit.`); return; }
  case 'plant': {
    const t = tileAt(st, op.i); need(t.t==='F' && t.age<0, 'Tady není paseka.'); need(s!==3, 'Stromky se v zimě nesázejí.');
    pay(st, 8000, 'sazenice'); t.age = 0; addLog(st, by, `vysadil/a mladý les na pasece ${t.name} 🌱 (${kc(8000)})`); return; }
  case 'stock': {
    const t = tileAt(st, op.i); need(t.t==='W' && !t.stocked, 'Rybník už je zarybněný.'); need(s===0, 'Plůdek se do rybníka vysazuje na jaře.');
    pay(st, 8000, 'plůdek'); t.stocked = true; t.fhp = 1;
    addLog(st, by, `vysadil/a kapří plůdek do rybníka ${t.name} 🐟 (${kc(8000)})`); return; }
  case 'fish': {
    const t = tileAt(st, op.i); need(t.t==='W' && t.stocked, 'V rybníku nejsou ryby.'); need(s===2, 'Rybníky se loví na podzim.');
    const amt = Math.round(42000*t.fhp*clamp(+op.r||1,0.9,1.1)); st.money += amt; t.stocked = false;
    addLog(st, by, `vylovil/a rybník ${t.name} a prodal/a kapry za ${kc(amt)} 🐟`); return; }
  case 'convert': {
    const t = tileAt(st, op.i);
    if(t.t==='U' && op.to==='P'){ pay(st, 12000, 'rozorání'); Object.assign(t, {t:'P', N:30, H:45, hist:[], crop:null}); t.name = t.name.replace('Pustina','Nové pole');
      addLog(st, by, `rozoral/a pustinu na nové pole ${t.name} 🚜 (${kc(12000)})`); return; }
    if(t.t==='P' && op.to==='L'){ need(!t.crop, 'Nejdřív pole skliďte nebo zaorejte.'); pay(st, 6000, 'travní směs');
      const old = t.name; ['N','H','hist','crop','fs'].forEach(k=>delete t[k]); t.t='L'; t.name = 'Louka ' + old;
      addLog(st, by, `zatravnil/a pole ${old} – je z něj louka 🌼 (${kc(6000)})`); return; }
    if(t.t==='L' && op.to==='P'){ pay(st, 9000, 'rozorání'); Object.assign(t, {t:'P', N:55, H:70, hist:['jetel'], crop:null});
      delete t.mown; t.name = t.name.replace(/^Louka /,'') || 'Nové pole';
      addLog(st, by, `rozoral/a louku na pole ${t.name} 🚜 (${kc(9000)})`); return; }
    throw new Nope('Tuhle změnu udělat nejde.'); }
  case 'sell': {
    const it = ITEMS[op.item], amt = r1(+op.amt); need(it && !it.keep, 'To se prodat nedá.'); need(amt>0 && amt <= (st.store[op.item]||0)+1e-9, 'Tolik toho ve skladu nemáte.');
    const sum = Math.round(amt*st.prices[op.item]); st.store[op.item] = r1(st.store[op.item]-amt); st.money += sum;
    addLog(st, by, `prodal/a ${t1(amt)} ${it.u||'t'} ${it.n.toLowerCase()} ${it.ico} za ${kc(sum)}`); return; }
  case 'buy': {
    const it = ITEMS[op.item], amt = r1(+op.amt); need(it && !it.keep, 'To se koupit nedá.'); need(amt>0, 'Špatné množství.');
    const sum = Math.round(amt*st.prices[op.item]*1.2); pay(st, sum, 'nákup');
    st.store[op.item] = r1((st.store[op.item]||0)+amt);
    addLog(st, by, `koupil/a ${t1(amt)} ${it.u||'t'} ${it.n.toLowerCase()} ${it.ico} za ${kc(sum)}`); return; }
  case 'buyA': {
    const A = ANIMALS[op.a]; need(A, 'Neznámé zvíře.'); pay(st, A.price, A.one);
    st.animals[op.a]++; addLog(st, by, `koupil/a ${A.one} ${A.ico} za ${kc(A.price)}`); return; }
  case 'sellA': {
    const A = ANIMALS[op.a]; need(A && st.animals[op.a]>0, 'Žádné takové zvíře nemáte.');
    const sum = Math.round(A.price*0.7); st.animals[op.a]--; st.money += sum;
    addLog(st, by, `prodal/a ${A.one} ${A.ico} za ${kc(sum)}`); return; }
  case 'rename': {
    const t = tileAt(st, op.i), name = String(op.name||'').trim().slice(0,22); need(name, 'Napište jméno.');
    addLog(st, by, `přejmenoval/a „${t.name}“ na „${name}“`); t.name = name; return; }
  case 'note': { const t = tileAt(st, op.i); t.note = String(op.note||'').slice(0,400); return; }
  case 'farmname': { const n = String(op.name||'').trim().slice(0,30); need(n,'Napište jméno.'); st.name = n; addLog(st, by, `pojmenoval/a statek „${n}“`); return; }
  case 'ready': { if(op.on) st.ready[by] = sk(st); else delete st.ready[by]; return; }
  case 'advance': { need(op.from === sk(st), 'Období už skončilo.'); advance(st, op); return; }
  }
  throw new Nope('Neznámá akce.');
}

function advance(st, op){
  const s = st.season, w = st.weather, msgs = [];
  // zvířata
  const fp = feedPlan(st, s);
  if(st.animals.kravy){
    const k = st.animals.kravy; let fed = k;
    if(fp.hay > 0){
      if((st.store.seno||0) >= fp.hay) st.store.seno = r1(st.store.seno - fp.hay);
      else { fed = Math.min(k, Math.min(k,fp.cap) + Math.floor((st.store.seno||0)/1.5)); st.store.seno = r1((st.store.seno||0) - (fed-Math.min(k,fp.cap))*1.5);
        msgs.push(`⚠️ Nebylo dost sena: ${k-fed} z ${k} krav hladovělo a nedojilo.`); }
    }
    const milk = fed*7000; st.money += milk; st.store.hnuj = r1((st.store.hnuj||0) + k*5);
    msgs.push(`🐄 Mléko od ${fed} krav: +${kc(milk)}, hnůj +${k*5} t`);
  }
  if(st.animals.slepice){
    let needG = fp.grain, eaten = 0;
    for(const x of ['jecmen','kukurice','psenice']){ const take = Math.min(needG-eaten, st.store[x]||0); if(take>0){ st.store[x] = r1(st.store[x]-take); eaten += take; } }
    const frac = needG ? eaten/needG : 1, eggs = Math.round(st.animals.slepice*4500*frac);
    st.money += eggs; st.store.hnuj = r1((st.store.hnuj||0) + st.animals.slepice*0.5);
    msgs.push(`🐔 Vejce: +${kc(eggs)}` + (frac<0.99 ? ' (slepicím chybělo obilí ve skladu)' : ''));
  }
  if(st.animals.ula && s===1){ const med = Math.round(st.animals.ula*7000*(w==='sucho'?0.7:1)); st.money += med; msgs.push(`🐝 Med: +${kc(med)}`); }
  // pole, les, rybník
  st.tiles.forEach((t,i) => {
    if(t.t==='P'){
      const c = t.crop;
      if(c){
        if(c.ripe){ c.late++; c.hp *= 0.7;
          if(c.late>=2){ msgs.push(`🥀 Na poli ${t.name} shnila nesklizená úroda.`); t.hist.push(c.k); if(t.hist.length>4) t.hist.shift(); t.crop = null; }
          else msgs.push(`⏰ Na poli ${t.name} čeká zralá úroda – kazí se, sklízejte!`); }
        else {
          let f = WEATHER[w].f;
          if(w==='sucho' && nearWater(st,i)) f = 0.9;
          if(w==='mraz') f = (c.k==='psenice'||c.k==='repka') ? 0.75 : 1;
          c.hp *= f; c.age++;
          if(c.age >= CROPS[c.k].grow) c.ripe = true;
          if(w==='dest' && (c.k==='kukurice'||c.k==='brambory')) t.H = clamp(t.H-2,0,100);
        }
      } else {
        t.N = clamp(t.N+4,0,100); t.H = clamp(t.H+(w==='dest'?-3:1),0,100);
      }
      t.N = clamp(t.N+1,0,100);
    }
    if(t.t==='F' && t.age>=0) t.age++;
    if(t.t==='W' && t.stocked && w==='sucho') t.fhp *= 0.85;
  });
  if(w==='dest') msgs.push('⛈️ Liják odnesl kus hlíny z holých polí a z kukuřice a brambor.');
  // náklady a dotace
  const pv = provoz(st); st.money -= pv; msgs.push(`🧾 Provoz statku (nafta, energie, opravy): −${kc(pv)}`);
  if(s===3){ const d = dotace(st); st.money += d; msgs.push(`🇪🇺 Roční dotace na obhospodařovanou půdu: +${kc(d)}`);
    if(natureScore(st)>=65){ st.money += 15000; msgs.push(`🦋 Bonus za péči o přírodu: +${kc(15000)}`); } }
  // záznam a nové období
  st.hist.push({l:`${st.year}/${SEAS[s].n}`, m:Math.round(st.money), h:soilScore(st), p:natureScore(st)});
  if(st.hist.length>60) st.hist.shift();
  st.season = (s+1)%4; if(st.season===0) st.year++;
  st.weather = WEATHER[op.w] ? op.w : 'norm';
  if(op.prices && typeof op.prices==='object') for(const k of Object.keys(ITEMS)) if(+op.prices[k]>0) st.prices[k] = +op.prices[k];
  st.ready = {};
  addLog(st, '', `${SEAS[st.season].i} Začíná ${seasonName(st.year, st.season)}. Počasí: ${WEATHER[st.weather].i} ${WEATHER[st.weather].n}.\n` + msgs.join('\n'));
}

/* ---------- synchronizace ---------- */
function newer(a, b){ return a.rev > b.rev || (a.rev===b.rev && String(a.by) > String(b.by)); }
function commitOp(op){
  const n = clone(S); applyOp(n, op);
  n.applied.push(op.id); if(n.applied.length>300) n.applied.splice(0, n.applied.length-300);
  n.rev++; n.by = myId; n.ts = Date.now(); S = n;
}
function act(type, data={}, quiet=false){
  if(!S) return false;
  const op = {id:rand(10), by:myId, type, ...data};
  try { commitOp(op); }
  catch(e){ if(e instanceof Nope){ if(!quiet) toast(e.message); return false; } throw e; }
  pending.push({op, t:Date.now()});
  saved(); publish(true); render();
  return true;
}
function receiveState(d){
  if(!d || d.v!==1 || d.code!==code || typeof d.rev!=='number' || !Array.isArray(d.tiles)) return;
  if(!S){ S = d; replayPending(); saved(); if(mode==='wait') startGame(); else render(); return; }
  if(newer(d, S)){
    S = d;
    if(replayPending()) publish(true);
    saved(); render(); checkAdvance();
  } else if(d.rev < S.rev) publish(false);     // ten druhý má starší stav – pošleme mu náš
}
function replayPending(){
  const now = Date.now(); let changed = false;
  pending = pending.filter(p => now - p.t < 120000 && !S.applied.includes(p.op.id));
  for(const p of pending){ try { commitOp(p.op); changed = true; } catch(e){ if(!(e instanceof Nope)) throw e; } }
  return changed;
}
function publish(now){
  if(!bus || !S) return;
  const go = () => { lastPub = Date.now(); pubTimer = null; bus.publish('state', S, true); };
  if(now || Date.now()-lastPub > 3000){ clearTimeout(pubTimer); go(); }
  else if(!pubTimer) pubTimer = setTimeout(go, 3000 - (Date.now()-lastPub));
}
function saved(){
  if(!S) return;
  LS.set('statek-'+code, S);
  const rec = LS.get('st-recent', []).filter(x=>x.code!==code);
  rec.unshift({code, name:S.name, label:seasonName(S.year,S.season), t:Date.now()});
  LS.set('st-recent', rec.slice(0,6));
}
function makeBus(c, onMsg, onStatus){
  const base = TOPIC + c;
  if(LOCAL_TEST || c==='SOLO'){
    if(c==='SOLO') { setTimeout(onStatus,0); return { publish(){}, count:()=>1, total:1, end(){} }; }
    const bc = new BroadcastChannel(base);
    bc.onmessage = e => onMsg(e.data.k, e.data.d);
    setTimeout(onStatus, 0);
    return { publish(k,d){ bc.postMessage({k,d:clone(d)}); }, count:()=>1, total:1, end(){ bc.close(); } };
  }
  const clients = [];
  for(const b of BROKERS){
    let cl;
    try { cl = mqtt.connect(b.url, { clientId:'st_'+rand(12), username:b.username, password:b.password,
            clean:true, connectTimeout:10000, reconnectPeriod:5000, keepalive:30 }); } catch(e){ continue; }
    clients.push(cl);
    cl.on('connect', () => { cl.subscribe([base+'/state', base+'/hi'], {qos:1}); onStatus(); });
    cl.on('message', (t, payload) => { let d; try{ d = JSON.parse(payload.toString()); }catch(e){ return; } onMsg(t.endsWith('/state')?'state':'hi', d); });
    cl.on('close', onStatus); cl.on('error', ()=>{});
  }
  return {
    publish(k, d, retain){ const s = JSON.stringify(d); for(const cl of clients) if(cl.connected) cl.publish(base+'/'+k, s, {qos:1, retain:!!retain}); },
    count: () => clients.filter(cl=>cl.connected).length, total: clients.length,
    end(){ for(const cl of clients) try{ cl.end(true); }catch(e){} }
  };
}
function hi(){ if(bus) bus.publish('hi', {id:myId, name:myName, avatar:myAvatar, rev:S?S.rev:0}); }
function onlineIds(){ const now = Date.now(); return [myId, ...Object.keys(online).filter(id => id!==myId && now-online[id].t < ONLINE_MS)]; }
function checkAdvance(){
  if(!S || mode!=='game') return;
  const ids = onlineIds(), key = sk(S);
  if(!ids.every(id => S.ready[id]===key)) return;
  if(ids.slice().sort()[0] !== myId) return;            // posune jen jeden z hráčů
  if(advanceKey === S.code+key) return; advanceKey = S.code+key;
  doAdvance();
}
function doAdvance(){
  const next = (S.season+1)%4;
  act('advance', {from:sk(S), w:rollWeather(next), prices:rollPrices(next)});
}

/* ---------- spuštění ---------- */
function stopAll(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t);}); timers=[]; if(bus){ const b=bus; setTimeout(()=>b.end(),200); } bus=null; online={}; pending=[]; }
function openFarm(c, initial){
  stopAll();
  code = c; S = initial || LS.get('statek-'+c, null);
  if(S && (S.v!==1 || S.code!==c)) S = null;
  if(c!=='SOLO') setUrl(c);
  $('#homeBtn').hidden = false;
  bus = makeBus(c, (k,d) => {
    if(k==='state') return receiveState(d);
    if(k==='hi' && d && typeof d.id==='string' && d.id!==myId){
      const isNew = !online[d.id] || Date.now()-online[d.id].t > ONLINE_MS;
      online[d.id] = {name:String(d.name||'').slice(0,16), avatar:String(d.avatar||'').slice(0,8), t:Date.now()};
      if(S && (isNew || (d.rev||0) < S.rev)) publish(false);   // nováček nebo opožděný hráč dostane náš stav
      if(isNew){ hi(); render(); }
    }
  }, () => { hi(); render(); });
  if(S){ saved(); publish(false); startGame(); } else { mode='wait'; waitSince = Date.now(); waitScreen(); timers.push(setTimeout(()=>{ if(mode==='wait') waitScreen(); }, 9000)); }
  timers.push(setInterval(() => { hi(); checkAdvance(); if(mode==='game') renderTop(); }, 5000));
}
function startGame(){
  mode = 'game';
  if(!S.players[myId] || S.players[myId].name!==myName || S.players[myId].avatar!==myAvatar) act('hello', {name:myName, avatar:myAvatar}, true);
  if(sel >= S.tiles.length) sel = 0;
  render(); hi();
}
function setUrl(c){ try{ history.replaceState(null,'',location.pathname+'?statek='+c+(LOCAL_TEST?'&test':'')); }catch(e){} }
function goMenu(){ stopAll(); S=null; mode='menu'; $('#homeBtn').hidden = true;
  try{ history.replaceState(null,'',location.pathname+(LOCAL_TEST?'?test':'')); }catch(e){} menuScreen(); }
$('#homeBtn').onclick = goMenu;

  a.download = `statek-${code}-rok${S.year}-${SEAS[S.season].n.toLowerCase()}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function endWarnings(){
  const w = [];
  const ripe = fields(S).filter(t=>t.crop&&t.crop.ripe); if(ripe.length) w.push(`✨ Nesklizená zralá úroda: ${ripe.map(t=>t.name).join(', ')}.`);

  if(fp.grain > fp.grainHave + 1e-9) w.push(`🐔 Slepice potřebují ${t1(fp.grain)} t obilí, ve skladu je ${t1(fp.grainHave)} t.`);

}
function tileView(t){
  let ico = '', cls = 't-'+t.t, badge = '', sub = t.name;
  if(t.t==='P'){
    if(t.crop){ const C = CROPS[t.crop.k];
      if(t.crop.ripe){ ico = C.ico; cls += ' ripe'; badge = '✨'; }
      else { ico = t.crop.age===0 ? '🌱' : '🌿'; cls += ' grown'; }
    }
  }
  if(t.t==='L') ico = '🌼';
  if(t.t==='F'){ ico = t.age<0 ? '🪵' : t.age<12 ? '🌱' : '🌲'; if(t.age<0) cls += ' cut'; }
  if(t.t==='W') ico = t.stocked ? '🐟' : '💧';
  if(t.t==='D') ico = '🏡';
  if(t.t==='U') ico = '🪨';
  if(t.note) badge += '📝';
  return {ico, cls, badge, sub};
}
function soilColor(H){ const k = clamp(H,0,100)/100; const a = [196,160,112], b = [110,70,38];

function chart(h){
  const W = 640, H = 200, pad = 34, n = h.length;
  const ms = h.map(r=>r.m), lo = Math.min(0, ...ms), hi = Math.max(...ms, 1);
  const x = i => pad + i*(W-pad-10)/(n-1), ym = v => H-22 - (v-lo)/(hi-lo||1)*(H-40), yp = v => H-22 - v/100*(H-40);
  const line = (f, key) => h.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${f(r[key]).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf vývoje kasy, zdraví půdy a přírody">
    <line x1="${pad}" x2="${W-10}" y1="${ym(0)}" y2="${ym(0)}" stroke="#e6e1cc" stroke-width="2"/>
    <path d="${line(ym,'m')}" fill="none" stroke="#a0692f" stroke-width="3" stroke-linejoin="round"/>
    <path d="${line(yp,'h')}" fill="none" stroke="#3f8a2e" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="${line(yp,'p')}" fill="none" stroke="#2d72c0" stroke-width="2.5" stroke-dasharray="2 4"/>
    <text x="${pad}" y="14" font-size="12" font-weight="700" fill="#6b6a55">${kc(hi)}</text>
    <text x="${pad}" y="${H-6}" font-size="11" fill="#6b6a55">${esc(h[0].l)}</text><text x="${W-10}" y="${H-6}" font-size="11" fill="#6b6a55" text-anchor="end">${esc(h[n-1].l)}</text>
  </svg><div class="legend"><span><i style="background:#a0692f"></i>kasa</span><span><i style="background:#3f8a2e"></i>zdraví půdy (0–100)</span><span><i style="background:#2d72c0"></i>příroda (0–100)</span></div>`;
}
